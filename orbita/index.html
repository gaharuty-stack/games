<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Орбита</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eaf0ff}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 18px;pointer-events:none;font-weight:700}
  #score{font-size:44px;line-height:1;text-shadow:0 0 18px #66ccff88}
  #best{font-size:14px;opacity:.7;margin-top:6px}
  #mute{pointer-events:auto;background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:12px;
    width:44px;height:44px;font-size:20px;cursor:pointer}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:radial-gradient(circle at center,#0a1030cc,#02030add);text-align:center;padding:24px}
  .hidden{display:none!important}
  h1{font-size:clamp(40px,11vw,76px);margin:0;letter-spacing:.08em;
    background:linear-gradient(90deg,#77ccff,#cc88ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{margin:0;font-size:30px}
  p{margin:0;opacity:.8;max-width:420px;line-height:1.45}
  .final{font-size:72px;font-weight:800;line-height:1}
  .tag{color:#ffd66b;font-weight:700;min-height:1.4em}
  button.big{font:inherit;font-size:22px;font-weight:700;padding:14px 34px;border-radius:16px;border:0;cursor:pointer;
    color:#05060f;background:linear-gradient(90deg,#77ccff,#cc88ff);box-shadow:0 0 24px #77ccff66;min-width:240px}
  button.alt{background:#ffffff18;color:#fff;box-shadow:none;border:1px solid #ffffff40;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><div id="score">0</div><div id="best"></div></div>
  <button id="mute" aria-label="sound">🔊</button>
</div>

<div id="menu" class="screen">
  <h1 data-i="title"></h1>
  <p data-i="hint"></p>
  <button class="big" id="playBtn" data-i="play"></button>
</div>

<div id="over" class="screen hidden">
  <h2 data-i="over"></h2>
  <div class="final" id="final">0</div>
  <div class="tag" id="tag"></div>
  <button class="big" id="contBtn"></button>
  <button class="big alt" id="againBtn" data-i="again"></button>
</div>

<div id="pause" class="screen hidden">
  <h2 data-i="paused"></h2>
  <button class="big" id="resumeBtn" data-i="resume"></button>
</div>

<script>
"use strict";
// ---------- локализация ----------
const I18N = {
  ru: { title:"ОРБИТА", hint:"Нажимайте на экран или пробел, чтобы перепрыгнуть на другую орбиту. Собирайте кристаллы и уворачивайтесь от астероидов.",
        play:"Играть", again:"Ещё раз", cont:"▶ Продолжить за рекламу", contFree:"Продолжить", over:"Крушение!",
        best:"Рекорд", newBest:"Новый рекорд!", paused:"Пауза", resume:"Продолжить" },
  en: { title:"ORBIT", hint:"Tap or press Space to jump to the other orbit. Collect crystals and dodge asteroids.",
        play:"Play", again:"Play again", cont:"▶ Continue (watch ad)", contFree:"Continue", over:"Crashed!",
        best:"Best", newBest:"New best!", paused:"Paused", resume:"Resume" }
};
let lang = (navigator.language || "ru").slice(0,2);
lang = ["ru","uk","be","kk","uz"].includes(lang) ? "ru" : "en";
const T = k => I18N[lang][k];
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i));
  updateHud();
}

// ---------- хранилище (может быть недоступно) ----------
function load(k, d){ try { const v = localStorage.getItem("orbita_"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem("orbita_"+k, JSON.stringify(v)); } catch(e){} }

// ---------- площадки: ВК Игры, CrazyGames, Яндекс Игры ----------
// Без площадки (локально, свой сайт) игра работает, реклама просто пропускается.
let platform = "none", ysdk = null, adPlaying = false, lastInterstitial = 0;
const params = new URLSearchParams(location.search);
function loadScript(src, onload){
  const s = document.createElement("script");
  s.src = src; s.async = true; s.onload = onload; s.onerror = () => {};
  document.head.appendChild(s);
}
function setLangFrom(code){ if (!code) return; lang = ["ru","uk","be","kk","uz"].includes(code) ? "ru" : "en"; applyLang(); }
(function initPlatform(){
  const host = location.hostname, ref = document.referrer || "";
  if (params.has("vk_app_id") || params.get("platform") === "vk") {
    loadScript("https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js", () => {
      if (!window.vkBridge || !vkBridge.isEmbedded()) return;  // вне клиента ВК рекламу не вызываем
      platform = "vk";
      vkBridge.send("VKWebAppInit").catch(() => {});
      setLangFrom(params.get("vk_language"));
    });
  } else if (host.includes("crazygames") || ref.includes("crazygames") || params.get("platform") === "crazygames") {
    loadScript("https://sdk.crazygames.com/crazygames-sdk-v3.js", () => {
      if (!window.CrazyGames) return;
      CrazyGames.SDK.init().then(() => { platform = "crazygames"; }).catch(() => {});
    });
  } else if (location.protocol !== "file:" && !["localhost", "127.0.0.1"].includes(host) && !host.endsWith("github.io")) {
    loadScript("/sdk.js", () => {
      if (!window.YaGames) return;
      YaGames.init().then(sdk => {
        ysdk = sdk; platform = "yandex";
        setLangFrom(sdk.environment && sdk.environment.i18n && sdk.environment.i18n.lang);
        if (sdk.features && sdk.features.LoadingAPI) sdk.features.LoadingAPI.ready();
      }).catch(() => {});
    });
  }
})();
function gameplay(on){
  try {
    if (platform === "yandex") { const g = ysdk.features && ysdk.features.GameplayAPI; if (g) on ? g.start() : g.stop(); }
    else if (platform === "crazygames") on ? CrazyGames.SDK.game.gameplayStart() : CrazyGames.SDK.game.gameplayStop();
  } catch(e){}
}
function adOpen(){ adPlaying = true; if (ac) ac.suspend(); }
function adClose(){ adPlaying = false; if (ac && !muted && !document.hidden) ac.resume(); }
function showInterstitial(next){
  // не чаще раза в минуту, чтобы реклама не отпугивала игроков
  if (platform === "none" || Date.now() - lastInterstitial < 60000) { next(); return; }
  lastInterstitial = Date.now();
  const done = () => { adClose(); next(); };
  try {
    if (platform === "yandex") {
      ysdk.adv.showFullscreenAdv({ callbacks: { onOpen: adOpen, onClose: done, onError: done } });
    } else if (platform === "crazygames") {
      CrazyGames.SDK.ad.requestAd("midgame", { adStarted: adOpen, adFinished: done, adError: done });
    } else if (platform === "vk") {
      adOpen();
      vkBridge.send("VKWebAppShowNativeAds", { ad_format: "interstitial" }).catch(() => {}).finally(done);
    }
  } catch(e){ done(); }
}
function showRewarded(onReward){
  if (platform === "none") { onReward(); return; }
  try {
    if (platform === "yandex") {
      let got = false;
      ysdk.adv.showRewardedVideo({ callbacks: {
        onOpen: adOpen, onRewarded: () => { got = true; },
        onClose: () => { adClose(); if (got) onReward(); }, onError: adClose
      }});
    } else if (platform === "crazygames") {
      CrazyGames.SDK.ad.requestAd("rewarded", { adStarted: adOpen, adFinished: () => { adClose(); onReward(); }, adError: adClose });
    } else if (platform === "vk") {
      adOpen();
      vkBridge.send("VKWebAppShowNativeAds", { ad_format: "reward" })
        .then(d => { adClose(); if (d && d.result) onReward(); })
        .catch(adClose);
    }
  } catch(e){ adClose(); }
}

// ---------- звук (синтез, без файлов) ----------
let ac = null, muted = load("muted", false);
function unlockAudio(){
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; }
}
function beep(freq, dur, type="sine", vol=0.12, slide=0){
  if (muted || !ac || adPlaying || document.hidden) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}

// ---------- холст и раскладка ----------
const cv = document.getElementById("c"), cx2 = cv.getContext("2d");
let W, H, DPR, CX, CY, BASE, PLANET, R = [0,0], SHIP, ROCK, GEM;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2 + Math.min(30, H * 0.03);
  BASE = Math.min(W, H * 0.92);
  PLANET = BASE * 0.10; R = [BASE * 0.22, BASE * 0.35];
  SHIP = BASE * 0.024; ROCK = BASE * 0.032; GEM = BASE * 0.024;
}
window.addEventListener("resize", resize); resize();

const STARS = Array.from({length: 150}, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.3, p: Math.random() * 6.28 }));

// ---------- состояние ----------
const S = { state:"menu", paused:false, score:0, best:load("best", 0), theta:-Math.PI/2, orbit:0, t:0,
            omega:1.7, objs:[], parts:[], trail:[], spawnT:0.8, time:0, shake:0, inv:0, continued:false, deadT:0 };
const $ = id => document.getElementById(id);
const scoreEl = $("score"), bestEl = $("best");
function updateHud(){ scoreEl.textContent = S.score; bestEl.textContent = T("best") + ": " + S.best; }
function show(id){
  ["menu","over","pause"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  scoreEl.style.visibility = id === "menu" ? "hidden" : "visible";
}

const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const shipPos = () => { const r = R[0] + (R[1] - R[0]) * S.t; return [CX + Math.cos(S.theta) * r, CY + Math.sin(S.theta) * r]; };
const objPos = o => [CX + Math.cos(o.a) * R[o.orbit], CY + Math.sin(o.a) * R[o.orbit]];

function startGame(){
  Object.assign(S, { state:"play", score:0, theta:-Math.PI/2, orbit:0, t:0, omega:1.7, objs:[], trail:[],
                     spawnT:0.8, time:0, inv:0, continued:false });
  updateHud(); show(null); gameplay(true);
}

function spawn(){
  const lead = Math.min(2.6, S.omega * (0.95 + Math.random() * 0.7));
  const a = S.theta + lead;
  const gem = Math.random() < 0.38;
  const orbit = Math.random() < 0.5 ? 0 : 1;
  const gap = Math.max(0.6, S.omega * 0.32);
  for (const o of S.objs) {
    const d = Math.abs(angDiff(o.a, a));
    if (o.orbit === orbit && d < 0.3) return;
    if (!gem && o.type === "rock" && o.orbit !== orbit && d < gap) return;  // всегда оставляем проход
  }
  const verts = Array.from({length: 9}, () => 0.72 + Math.random() * 0.4);
  S.objs.push({ type: gem ? "gem" : "rock", orbit, a, age: 0, ttl: lead / S.omega + 0.6,
                rot: (Math.random() - 0.5) * 3, verts });
}

function burst(x, y, color, n, speed){
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 6.28, v = speed * (0.3 + Math.random());
    S.parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 0.5 + Math.random() * 0.5, max: 1, color });
  }
}

function die(){
  const [x, y] = shipPos();
  burst(x, y, "#ff9a5c", 40, BASE * 0.6); burst(x, y, "#ffffff", 14, BASE * 0.3);
  S.shake = 0.45; S.state = "dead"; S.deadT = 0.9; gameplay(false);
  beep(220, 0.5, "sawtooth", 0.15, -180);
  const nb = S.score > S.best;
  if (nb) { S.best = S.score; save("best", S.best); }
  $("final").textContent = S.score;
  $("tag").textContent = nb && S.score > 0 ? T("newBest") : "";
  $("contBtn").textContent = platform !== "none" ? T("cont") : T("contFree");
  $("contBtn").classList.toggle("hidden", S.continued || S.score === 0);
  updateHud();
}

function continueGame(){
  S.objs = S.objs.filter(o => o.type === "gem" || Math.abs(angDiff(o.a, S.theta)) > 1.4);
  Object.assign(S, { state:"play", inv:1.6, continued:true });
  show(null); gameplay(true);
}

function update(dt){
  S.time += dt;
  for (const st of STARS) st.p += dt;
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  S.shake = Math.max(0, S.shake - dt);

  if (S.state === "menu") { S.theta += 0.9 * dt; S.t += (0.5 + 0.5 * Math.sin(S.time) - S.t) * dt * 2; }
  if (S.state === "dead") { S.deadT -= dt; if (S.deadT <= 0 && $("over").classList.contains("hidden")) show("over"); return; }
  if (S.state !== "play") { pushTrail(); return; }

  S.omega = Math.min(3.4, 1.7 + S.score * 0.03 + S.time * 0.012);
  S.theta += S.omega * dt;
  S.t += (S.orbit - S.t) * Math.min(1, dt * 14);
  S.inv = Math.max(0, S.inv - dt);
  pushTrail();

  S.spawnT -= dt;
  if (S.spawnT <= 0) { S.spawnT = Math.max(0.3, 0.6 - S.score * 0.006 - S.time * 0.002); spawn(); }

  const [sx, sy] = shipPos();
  for (const o of S.objs) {
    o.age += dt;
    if (o.age < 0.35 || o.dead) continue;
    const [ox, oy] = objPos(o);
    const hit = Math.hypot(ox - sx, oy - sy) < SHIP + (o.type === "rock" ? ROCK * 0.85 : GEM * 1.2);
    if (!hit) continue;
    if (o.type === "gem") {
      o.dead = true; S.score++; updateHud();
      burst(ox, oy, "#66ffee", 14, BASE * 0.35);
      beep(880 + Math.min(S.score, 40) * 12, 0.12, "triangle", 0.1, 400);
    } else if (S.inv <= 0) { die(); return; }
  }
  S.objs = S.objs.filter(o => !o.dead && o.age < o.ttl);
}
function pushTrail(){ S.trail.push(shipPos()); if (S.trail.length > 16) S.trail.shift(); }

// ---------- отрисовка ----------
function draw(){
  const g = cx2;
  g.save();
  const bg = g.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
  bg.addColorStop(0, "#101a40"); bg.addColorStop(1, "#03040c");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  if (S.shake > 0) { const k = S.shake * BASE * 0.04; g.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k); }

  for (const st of STARS) {
    g.globalAlpha = 0.35 + 0.35 * Math.sin(st.p * 1.3);
    g.fillStyle = "#fff"; g.fillRect(st.x * W, st.y * H, st.s, st.s);
  }
  g.globalAlpha = 1;

  // орбиты
  g.setLineDash([6, 10]); g.lineDashOffset = -S.time * 20; g.lineWidth = 2;
  R.forEach((r, i) => { g.strokeStyle = i === S.orbit && S.state === "play" ? "#7fd0ff66" : "#ffffff22";
    g.beginPath(); g.arc(CX, CY, r, 0, Math.PI * 2); g.stroke(); });
  g.setLineDash([]);

  // планета
  const halo = g.createRadialGradient(CX, CY, PLANET * 0.8, CX, CY, PLANET * 2.2);
  halo.addColorStop(0, "#5a7dff55"); halo.addColorStop(1, "#5a7dff00");
  g.fillStyle = halo; g.beginPath(); g.arc(CX, CY, PLANET * 2.2, 0, 6.29); g.fill();
  const pg = g.createRadialGradient(CX - PLANET * 0.35, CY - PLANET * 0.35, PLANET * 0.1, CX, CY, PLANET);
  pg.addColorStop(0, "#9fb8ff"); pg.addColorStop(0.6, "#4a5fd0"); pg.addColorStop(1, "#1d2370");
  g.fillStyle = pg; g.beginPath(); g.arc(CX, CY, PLANET, 0, 6.29); g.fill();

  // объекты
  for (const o of S.objs) {
    const [x, y] = objPos(o);
    const k = Math.min(1, o.age / 0.35);
    g.save(); g.translate(x, y); g.globalAlpha = k;
    if (o.age < 0.35) {  // предупреждающее кольцо
      g.strokeStyle = o.type === "rock" ? "#ff8a6b" : "#66ffee"; g.lineWidth = 2;
      g.beginPath(); g.arc(0, 0, (o.type === "rock" ? ROCK : GEM) * (2 - k), 0, 6.29); g.stroke();
    }
    g.scale(k, k);
    if (o.type === "rock") {
      g.rotate(o.age * o.rot);
      g.fillStyle = "#6e6480"; g.strokeStyle = "#c9b6e0"; g.lineWidth = 2;
      g.beginPath();
      o.verts.forEach((v, i) => { const an = i / o.verts.length * 6.283; const px = Math.cos(an) * ROCK * v, py = Math.sin(an) * ROCK * v; i ? g.lineTo(px, py) : g.moveTo(px, py); });
      g.closePath(); g.fill(); g.stroke();
    } else {
      const p = 1 + 0.12 * Math.sin(S.time * 8 + o.a);
      g.rotate(S.time * 1.5); g.scale(p, p);
      g.fillStyle = "#66ffee33"; g.beginPath(); g.arc(0, 0, GEM * 1.7, 0, 6.29); g.fill();
      g.fillStyle = "#7ffff0"; g.strokeStyle = "#ffffff"; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(0, -GEM); g.lineTo(GEM * 0.7, 0); g.lineTo(0, GEM); g.lineTo(-GEM * 0.7, 0); g.closePath(); g.fill(); g.stroke();
    }
    g.restore();
  }

  // шлейф и корабль
  if (S.state !== "dead") {
    for (let i = 1; i < S.trail.length; i++) {
      g.strokeStyle = `rgba(120,200,255,${i / S.trail.length * 0.5})`; g.lineWidth = SHIP * 0.6 * i / S.trail.length;
      g.beginPath(); g.moveTo(...S.trail[i - 1]); g.lineTo(...S.trail[i]); g.stroke();
    }
    const blink = S.inv > 0 && Math.floor(S.time * 12) % 2 === 0;
    if (!blink) {
      const [x, y] = shipPos();
      g.save(); g.translate(x, y); g.rotate(S.theta + Math.PI / 2);
      g.fillStyle = "#ffffff"; g.shadowColor = "#7fd0ff"; g.shadowBlur = 16;
      g.beginPath(); g.moveTo(SHIP * 1.3, 0); g.lineTo(-SHIP, SHIP * 0.8); g.lineTo(-SHIP * 0.5, 0); g.lineTo(-SHIP, -SHIP * 0.8); g.closePath(); g.fill();
      g.restore();
    }
  }

  // частицы
  for (const p of S.parts) { g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.color; g.fillRect(p.x - 2, p.y - 2, 4, 4); }
  g.restore();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.paused && !adPlaying) update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- ввод ----------
function press(){
  unlockAudio();
  if (S.state === "play" && !S.paused) { S.orbit ^= 1; beep(420 + S.orbit * 200, 0.07, "triangle", 0.07); }
}
cv.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
window.addEventListener("keydown", e => {
  if (!["Space","ArrowUp","ArrowDown","Enter"].includes(e.code)) return;
  e.preventDefault();
  if (S.state === "menu") { unlockAudio(); startGame(); }
  else if (S.paused) resume();
  else press();
});
window.addEventListener("contextmenu", e => e.preventDefault());

$("playBtn").onclick = () => { unlockAudio(); startGame(); };
$("againBtn").onclick = () => showInterstitial(startGame);
$("contBtn").onclick = () => showRewarded(continueGame);
$("resumeBtn").onclick = () => resume();
function resume(){ S.paused = false; show(null); if (S.state === "play") gameplay(true); }
const muteBtn = $("mute");
function renderMute(){ muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.onclick = e => { e.stopPropagation(); unlockAudio(); muted = !muted; save("muted", muted); renderMute(); };
muteBtn.addEventListener("pointerdown", e => e.stopPropagation());

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (ac) ac.suspend();
    if (S.state === "play" && !S.paused) { S.paused = true; show("pause"); gameplay(false); }
  } else if (ac && !adPlaying) ac.resume();
});

renderMute(); applyLang(); show("menu"); requestAnimationFrame(frame);
</script>
</body>
</html>
